<body>
<div class="wrap">

<script>
'use strict';
const COLS=['구분','관사','스페인어','한국어','영어','사용 상황','불규칙','비고','참고01','참고02','참고03','참고04'];
const CLOUD_FIELDS=['row_id','source_kind','dataset','article','spanish','korean','english','usage','irregular','note','ref1','ref2','ref3','ref4','created_at','updated_at'];
const DEFAULT_CLOUD_URL='https://script.google.com/macros/s/AKfycbwz_uMtyChOHQeop8Akj4WzE9g1Of-cU1USvs1LTStMIzpImiL47tS8ce8vQfpRAFLJfA/exec';
const LS_CLOUD_URL='spanish_search_multi_cloud_url_v1',LS_CACHE='spanish_fast_master_cache_v9',LS_CACHE_REVISION='spanish_fast_master_revision_v9',LS_PENDING='spanish_fast_pending_ops_v9',LS_LAST_REFS='spanish_search_multi_last_refs_v2',LS_LEGACY_CUSTOM='spanish_search_multi_custom_rows_v2',LS_LEGACY_MIGRATED='spanish_fast_legacy_migrated_v9';
const EMBEDDED_SNAPSHOT_ROWS=[];
const $=id=>document.getElementById(id), qEl=$('q'), addBtn=$('addBtn'), cloudConnectBtn=$('cloudConnectBtn'), exportBtn=$('exportBtn'), exportHtmlBtn=$('exportHtmlBtn'), loadBtn=$('loadBtn'), clearBtn=$('clearBtn'), warnNoXlsx=$('warnNoXlsx'), totalN=$('totalN'), shownN=$('shownN'), customN=$('customN'), fVocab=$('fVocab'), fAdv=$('fAdv'), fCustom=$('fCustom'), cloudStatusPill=$('cloudStatusPill'), hdrEl=$('hdr'), bodyEl=$('body'), fileInput=$('fileInput'), modalBackdrop=$('modalBackdrop'), modalTitle=$('modalTitle'), modalHint=$('modalHint'), closeModalBtn=$('closeModalBtn'), applyLastRefBtn=$('applyLastRefBtn'), copyCurrentSearchBtn=$('copyCurrentSearchBtn'), clearFormBtn=$('clearFormBtn'), formKind=$('formKind'), formArticle=$('formArticle'), formEs=$('formEs'), formKo=$('formKo'), formEn=$('formEn'), formUse=$('formUse'), formIrregular=$('formIrregular'), formNote=$('formNote'), formRef1=$('formRef1'), formRef2=$('formRef2'), formRef3=$('formRef3'), formRef4=$('formRef4'), saveBtn=$('saveBtn'), saveAndKeepBtn=$('saveAndKeepBtn');
const lastRefEls=[$('lastRef1'),$('lastRef2'),$('lastRef3'),$('lastRef4')];
const norm=v=>String(v==null?'':v).trim(), clone=v=>JSON.parse(JSON.stringify(v));
function safeJson(k,f){try{const r=localStorage.getItem(k);return r?JSON.parse(r):clone(f)}catch(_){return clone(f)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c])}
function rx(v){return String(v).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function makeId(p='r'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9)}
function dateMs(v){const n=Date.parse(v||'');return Number.isFinite(n)?n:0}
function normalizeRecord(i={}){const o={};CLOUD_FIELDS.forEach(f=>o[f]=norm(i[f]));if(!o.row_id)o.row_id=makeId('r');if(!o.source_kind)o.source_kind='base';if(!o.dataset)o.dataset='내추가';return o}
function compactToRecord(v){const o={};CLOUD_FIELDS.forEach((f,i)=>o[f]=v&&v[i]!=null?String(v[i]):'');return normalizeRecord(o)}
function displayRow(r){return[r.dataset,r.article,r.spanish,r.korean,r.english,r.usage,r.irregular,r.note,r.ref1,r.ref2,r.ref3,r.ref4].map(norm)}
function sig(r){return displayRow(r).map(v=>norm(v).toLowerCase()).join('␟')}
function legacyToRecord(e){return normalizeRecord({row_id:e._id||makeId('legacy'),source_kind:'custom',dataset:e['구분']||'내추가',article:e['관사'],spanish:e['스페인어'],korean:e['한국어'],english:e['영어'],usage:e['사용 상황'],irregular:e['불규칙'],note:e['비고'],ref1:e['참고01'],ref2:e['참고02'],ref3:e['참고03'],ref4:e['참고04'],created_at:e._created_at||'',updated_at:e._updated_at||''})}
function entryToRecord(e,x=null){const now=new Date().toISOString();return normalizeRecord({row_id:x?x.row_id:makeId('c'),source_kind:x?x.source_kind:'custom',dataset:e['구분']||'내추가',article:e['관사'],spanish:e['스페인어'],korean:e['한국어'],english:e['영어'],usage:e['사용 상황'],irregular:e['불규칙'],note:e['비고'],ref1:e['참고01'],ref2:e['참고02'],ref3:e['참고03'],ref4:e['참고04'],created_at:x?x.created_at:now,updated_at:x?now:''})}
function loadCache(){const c=safeJson(LS_CACHE,[]);if(Array.isArray(c)&&c.length)return c.map(normalizeRecord);if(EMBEDDED_SNAPSHOT_ROWS.length)return EMBEDDED_SNAPSHOT_ROWS.map(normalizeRecord);const l=safeJson(LS_LEGACY_CUSTOM,[]);return Array.isArray(l)?l.map(legacyToRecord):[]}
const getPending=()=>{const a=safeJson(LS_PENDING,[]);return Array.isArray(a)?a:[]}, setPending=a=>localStorage.setItem(LS_PENDING,JSON.stringify(a||[]));
function applyOps(rows,ops){const m=new Map(),order=[];rows.map(normalizeRecord).forEach(r=>{m.set(r.row_id,r);order.push(r.row_id)});(ops||[]).forEach(o=>{if(!o||!o.row_id)return;if(o.type==='delete')return m.delete(o.row_id);if(o.type==='upsert'&&o.row){if(!m.has(o.row_id))order.push(o.row_id);m.set(o.row_id,normalizeRecord(o.row))}});return order.filter(id=>m.has(id)).map(id=>m.get(id))}
let masterRows=applyOps(loadCache(),getPending()), cloudRevision=localStorage.getItem(LS_CACHE_REVISION)||'';
function saveCache(){try{localStorage.setItem(LS_CACHE,JSON.stringify(masterRows));if(cloudRevision)localStorage.setItem(LS_CACHE_REVISION,cloudRevision)}catch(e){console.warn(e)}}
function queueOp(op,flush=true){const a=getPending().filter(x=>x.row_id!==op.row_id);a.push({...op,op_id:makeId('op')});setPending(a);updateCloudStatus();if(flush&&cloudEnabled&&cloudLoaded)scheduleFlush()}
function upsertLocal(r){r=normalizeRecord(r);const i=masterRows.findIndex(x=>x.row_id===r.row_id);if(i>=0)masterRows[i]=r;else masterRows.unshift(r);queueOp({type:'upsert',row_id:r.row_id,row:r,reason:'ui_upsert'})}
function deleteLocal(id){masterRows=masterRows.filter(r=>r.row_id!==id);queueOp({type:'delete',row_id:id,reason:'ui_delete'})}
function getLastRefs(){const r=safeJson(LS_LAST_REFS,{});return r&&typeof r==='object'&&!Array.isArray(r)?r:{}}
function setLastRefs(r){localStorage.setItem(LS_LAST_REFS,JSON.stringify(r||{}));updateLastRefDisplay()}
function updateLastRefDisplay(){const r=getLastRefs();[r.ref1,r.ref2,r.ref3,r.ref4].forEach((v,i)=>lastRefEls[i].textContent=norm(v)||'-')}
let cloudUrl=localStorage.getItem(LS_CLOUD_URL)||DEFAULT_CLOUD_URL,cloudEnabled=false,cloudLoaded=false,writeInFlight=false,flushTimer=null;
function updateCloudStatus(){const n=getPending().length;if(!cloudUrl)cloudStatusPill.textContent='클라우드: 로컬 모드'+(n?` · 미저장 ${n}`:'');else if(writeInFlight)cloudStatusPill.textContent='클라우드: 저장 중…';else if(cloudEnabled&&cloudLoaded)cloudStatusPill.textContent='클라우드: 연결됨'+(n?` · 미저장 ${n}`:'');else if(masterRows.length)cloudStatusPill.textContent='클라우드: 캐시 사용'+(n?` · 미저장 ${n}`:'');else cloudStatusPill.textContent='클라우드: 연결 대기';cloudConnectBtn.textContent=cloudEnabled?'☁ 새로고침':'☁ 클라우드 연결'}
function jsonp(action,params={}){return new Promise((resolve,reject)=>{const cb='__fastV9_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),s=document.createElement('script');let done=false;const t=setTimeout(()=>finish(new Error(action+' 응답 시간 초과')),20000);function clean(){clearTimeout(t);try{delete window[cb]}catch(_){}try{s.remove()}catch(_){}}function finish(err,data){if(done)return;done=true;clean();err?reject(err):resolve(data)}window[cb]=d=>{if(!d||!d.ok)return finish(new Error((d&&d.error)||action+' 실패'));finish(null,d)};const q=new URLSearchParams({action,callback:cb,_ts:String(Date.now())});Object.entries(params).forEach(([k,v])=>q.set(k,String(v)));s.onerror=()=>finish(new Error(action+' JSONP load failed'));s.src=cloudUrl+(cloudUrl.includes('?')?'&':'?')+q.toString();document.head.appendChild(s)})}
async function getManifest(){return jsonp('getManifest')}
async function getWholeWords(){const d=await jsonp('getWordsCompact');if(String(d.version||'')!=='fast-sync-v9')throw new Error('Apps Script v9이 아닙니다. 현재 서버: '+String(d.version||'unknown'));return{revision:String(d.revision||''),rows:Array.isArray(d.rows)?d.rows.map(compactToRecord):[]}}
async function getSyncInfo(){const d=await jsonp('getSyncInfo');return d.syncInfo||{}}
function hiddenPost(payload){return new Promise((resolve,reject)=>{const target='__frame_'+makeId('v9'),fr=document.createElement('iframe'),f=document.createElement('form'),i=document.createElement('textarea');fr.name=target;fr.style.display='none';f.method='POST';f.action=cloudUrl;f.target=target;f.style.display='none';i.name='payload';i.style.display='none';i.value=JSON.stringify(payload);f.appendChild(i);document.body.append(fr,f);try{f.submit()}catch(e){f.remove();fr.remove();return reject(e)}setTimeout(()=>{f.remove();fr.remove();resolve()},400)})}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function confirmToken(token){for(const w of[250,450,700,1000,1500,2200,3000]){await sleep(w);try{const i=await getSyncInfo();if(String(i.opToken||'')===token)return i}catch(_){}}return null}
function scheduleFlush(){if(flushTimer)clearTimeout(flushTimer);flushTimer=setTimeout(flushPending,120)}
async function flushPending(){if(!cloudEnabled||!cloudLoaded||writeInFlight)return false;const snap=getPending();if(!snap.length){updateCloudStatus();return true}writeInFlight=true;updateCloudStatus();const token=makeId('sync');try{await hiddenPost({action:'applyOps',opToken:token,ops:snap});const info=await confirmToken(token);if(!info)throw new Error('Google Sheet 저장 확인 실패');const sent=new Set(snap.map(o=>o.op_id));setPending(getPending().filter(o=>!sent.has(o.op_id)));cloudRevision=String(info.revision||cloudRevision);saveCache();writeInFlight=false;updateCloudStatus();if(getPending().length)scheduleFlush();return true}catch(e){console.error(e);writeInFlight=false;updateCloudStatus();return false}}
function legacyRescue(remote){if(localStorage.getItem(LS_LEGACY_MIGRATED)==='1')return[];const legacy=safeJson(LS_LEGACY_CUSTOM,[]);if(!Array.isArray(legacy)||!legacy.length)return[];const byId=new Map(remote.map(r=>[r.row_id,r])),signatures=new Set(remote.map(sig)),ops=[];legacy.forEach(e=>{const r=legacyToRecord(e),x=byId.get(r.row_id);if(!x&&!signatures.has(sig(r)))ops.push({type:'upsert',row_id:r.row_id,row:r,reason:'legacy_rescue'});else if(x&&dateMs(r.updated_at||r.created_at)>dateMs(x.updated_at||x.created_at))ops.push({type:'upsert',row_id:r.row_id,row:r,reason:'legacy_rescue_newer'})});return ops}
async function loadWholeCloud(silent=false){cloudStatusPill.textContent='클라우드: 전체 목록 불러오는 중…';const remote=await getWholeWords(),rescue=legacyRescue(remote.rows);if(rescue.length){const map=new Map(getPending().map(o=>[o.row_id,o]));rescue.forEach(o=>map.set(o.row_id,{...o,op_id:makeId('op')}));setPending([...map.values()])}const pending=getPending();masterRows=applyOps(remote.rows,pending);cloudRevision=remote.revision;cloudEnabled=cloudLoaded=true;saveCache();refreshAll();updateCloudStatus();let saved=true;if(pending.length)saved=await flushPending();if(saved)localStorage.setItem(LS_LEGACY_MIGRATED,'1');if(!silent)alert('클라우드 연결 완료\n\nWordsDB '+remote.rows.length.toLocaleString()+'개를 한 번에 불러왔습니다.'+(pending.length?'\n로컬 변경 '+pending.length+'건을 병합했습니다.':'')+'\n\n연결만으로 Sheet 전체를 덮어쓰지 않습니다.')}
async function connectCloud(url,silent=false){url=norm(url);if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(url))throw new Error('Apps Script 배포 관리 화면의 .../exec 주소를 사용하세요.');cloudUrl=url;localStorage.setItem(LS_CLOUD_URL,url);await loadWholeCloud(silent)}
async function manualCloudConnect(){const input=prompt('Apps Script Web App URL(/exec)\n\n확인을 누르면 WordsDB 전체를 한 번에 새로 읽습니다.\n비우고 확인하면 로컬 모드로 전환합니다.',cloudUrl||DEFAULT_CLOUD_URL);if(input===null)return;const c=norm(input);if(!c){cloudUrl='';cloudEnabled=cloudLoaded=false;localStorage.removeItem(LS_CLOUD_URL);updateCloudStatus();alert('로컬 모드로 전환했습니다.\n미저장 변경사항은 브라우저에 그대로 보존됩니다.');return}try{await connectCloud(c,false)}catch(e){console.error(e);alert('클라우드 연결 실패: '+(e.message||e));updateCloudStatus()}}
async function initializeCloud(){updateCloudStatus();if(!cloudUrl)return;try{const m=await getManifest();if(String(m.version||'')!=='fast-sync-v9')throw new Error('Apps Script v9 배포가 필요합니다. 현재 서버: '+String(m.version||'unknown'));const pending=getPending();cloudEnabled=cloudLoaded=true;const changed=!cloudRevision||String(m.revision||'')!==cloudRevision, countChanged=!pending.length&&Number(m.rowCount)!==masterRows.length;if(!masterRows.length||changed||countChanged)return await loadWholeCloud(true);updateCloudStatus();if(pending.length)await flushPending()}catch(e){console.warn('자동 cloud 확인 실패, cache 유지',e);cloudEnabled=cloudLoaded=false;updateCloudStatus()}}
let ROWS=[],SEARCH=[];
function makeHeader(){hdrEl.innerHTML='';[...COLS,'관리'].forEach(c=>{const th=document.createElement('th');th.textContent=c;hdrEl.appendChild(th)})}
function rebuild(){ROWS=masterRows.map(displayRow);SEARCH=ROWS.map(r=>r.join('␟').toLowerCase());totalN.textContent=ROWS.length.toLocaleString();customN.textContent=masterRows.filter(r=>r.source_kind==='custom').length.toLocaleString()}
function allowed(r){const t=norm(r[0]);return t==='단어장'?fVocab.checked:t==='부사'?fAdv.checked:fCustom.checked}
function tokenize(q){return norm(q).split(/\s+/).filter(Boolean)}
function highlight(text,terms){let o=esc(text);terms.forEach(t=>{if(t)o=o.replace(new RegExp(rx(esc(t)),'gi'),m=>`<mark>${m}</mark>`)});return o}
function onQuery(){const terms=tokenize(qEl.value),lower=terms.map(t=>t.toLowerCase()),idx=[];for(let i=0;i<SEARCH.length;i++)if(allowed(ROWS[i])&&lower.every(t=>SEARCH[i].includes(t)))idx.push(i);bodyEl.innerHTML='';const frag=document.createDocumentFragment();idx.forEach(i=>{const tr=document.createElement('tr'),record=masterRows[i];if(record.source_kind==='custom')tr.classList.add('custom-row');ROWS[i].forEach(v=>{const td=document.createElement('td');td.innerHTML=highlight(v,terms);tr.appendChild(td)});const td=document.createElement('td'),a=document.createElement('div');a.className='row-actions';const e=document.createElement('button'),d=document.createElement('button');e.className='btn small amber';e.textContent='E';e.onclick=()=>openEditModal(record.row_id);d.className='btn small danger';d.textContent='D';d.onclick=()=>deleteEntry(record.row_id);a.append(e,d);td.appendChild(a);tr.appendChild(td);frag.appendChild(tr)});bodyEl.appendChild(frag);shownN.textContent=idx.length.toLocaleString()}
function refreshAll(){makeHeader();rebuild();onQuery()}
let editingId=null;
function setModalMode(edit){modalTitle.textContent=edit?'단어 수정':'새 단어 추가';modalHint.textContent=edit?'수정하면 해당 행만 Google Sheet에 반영됩니다.':'클라우드가 끊겨 있어도 먼저 브라우저에 안전하게 저장됩니다.';saveBtn.textContent=edit?'수정 저장':'저장';saveAndKeepBtn.style.display=edit?'none':''}
function resetForm(keepRefs=false){editingId=null;setModalMode(false);formKind.value='내추가';[formArticle,formEs,formKo,formEn,formUse,formIrregular,formNote].forEach(x=>x.value='');if(!keepRefs)[formRef1,formRef2,formRef3,formRef4].forEach(x=>x.value='')}
function applyLastRefs(){const r=getLastRefs();formRef1.value=norm(r.ref1);formRef2.value=norm(r.ref2);formRef3.value=norm(r.ref3);formRef4.value=norm(r.ref4)}
function openAddModal(){resetForm(false);applyLastRefs();if(norm(qEl.value))formEs.value=norm(qEl.value);modalBackdrop.style.display='flex';setTimeout(()=>formEs.focus(),20)}
function openEditModal(id){const r=masterRows.find(x=>x.row_id===id);if(!r)return alert('수정할 단어를 찾지 못했습니다.');editingId=id;setModalMode(true);formKind.value=r.dataset||'내추가';formArticle.value=r.article;formEs.value=r.spanish;formKo.value=r.korean;formEn.value=r.english;formUse.value=r.usage;formIrregular.value=r.irregular;formNote.value=r.note;formRef1.value=r.ref1;formRef2.value=r.ref2;formRef3.value=r.ref3;formRef4.value=r.ref4;modalBackdrop.style.display='flex'}
function closeModal(){modalBackdrop.style.display='none';editingId=null;setModalMode(false)}
function formEntry(){return{'구분':norm(formKind.value)||'내추가','관사':norm(formArticle.value),'스페인어':norm(formEs.value),'한국어':norm(formKo.value),'영어':norm(formEn.value),'사용 상황':norm(formUse.value),'불규칙':norm(formIrregular.value),'비고':norm(formNote.value),'참고01':norm(formRef1.value),'참고02':norm(formRef2.value),'참고03':norm(formRef3.value),'참고04':norm(formRef4.value)}}
function saveForm(close=true){const e=formEntry();if(!e['스페인어'])return alert('스페인어는 꼭 입력해 주세요.');const x=editingId?masterRows.find(r=>r.row_id===editingId):null,r=entryToRecord(e,x);upsertLocal(r);setLastRefs({ref1:r.ref1,ref2:r.ref2,ref3:r.ref3,ref4:r.ref4});refreshAll();qEl.value=r.spanish;onQuery();if(close)closeModal();resetForm(true);applyLastRefs();setTimeout(()=>{qEl.focus();try{qEl.select()}catch(_){}} ,20)}
function deleteEntry(id){const r=masterRows.find(x=>x.row_id===id);if(r&&confirm('이 단어를 삭제할까요?\n\n'+r.spanish)){deleteLocal(id);refreshAll()}}
function exportCustom(){if(typeof XLSX==='undefined')return alert('xlsx.full.min.js 파일이 없습니다.');const rows=masterRows.filter(r=>r.source_kind==='custom').map(r=>Object.fromEntries(COLS.map((c,i)=>[c,displayRow(r)[i]])));if(!rows.length)return alert('내추가 단어가 없습니다.');const ws=XLSX.utils.json_to_sheet(rows,{header:COLS}),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'내추가단어');XLSX.writeFile(wb,'spanish_custom_words.xlsx')}
function findHeaderRow(rows){for(let i=0;i<Math.min(rows.length,120);i++){const s=(rows[i]||[]).map(v=>String(v??'')).join('|');if(s.includes('스페인어')&&(s.includes('한국어')||s.includes('영어')||s.includes('사용 상황')))return i}return 0}
async function mergeXlsx(file){if(typeof XLSX==='undefined')return alert('xlsx.full.min.js 파일이 없습니다.');const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false}),hr=findHeaderRow(data),headers=(data[hr]||[]).map(norm),ix={};headers.forEach((h,i)=>{if(h)ix[h]=i});const pick=(r,n)=>ix[n]===undefined?'':norm(r[ix[n]]),signatures=new Set(masterRows.map(sig)),ops=[];for(let i=hr+1;i<data.length;i++){const row=data[i]||[];if(!row.some(norm))continue;const e={'구분':'내추가','관사':pick(row,'관사'),'스페인어':pick(row,'스페인어'),'한국어':pick(row,'한국어'),'영어':pick(row,'영어'),'사용 상황':pick(row,'사용 상황'),'불규칙':pick(row,'불규칙'),'비고':pick(row,'비고'),'참고01':pick(row,'참고01'),'참고02':pick(row,'참고02'),'참고03':pick(row,'참고03'),'참고04':pick(row,'참고04')};const r=entryToRecord(e);if(!r.spanish&&!r.korean&&!r.english)continue;if(signatures.has(sig(r)))continue;signatures.add(sig(r));masterRows.push(r);ops.push({type:'upsert',row_id:r.row_id,row:r,reason:'xlsx_merge',op_id:makeId('op')})}const map=new Map(getPending().map(o=>[o.row_id,o]));ops.forEach(o=>map.set(o.row_id,o));setPending([...map.values()]);refreshAll();if(cloudEnabled&&cloudLoaded)scheduleFlush();alert('Excel 병합 완료: 신규 '+ops.length.toLocaleString()+'개')}
qEl.addEventListener('input',onQuery);[fVocab,fAdv,fCustom].forEach(x=>x.addEventListener('change',onQuery));clearBtn.onclick=()=>{qEl.value='';onQuery();qEl.focus()};addBtn.onclick=openAddModal;cloudConnectBtn.onclick=manualCloudConnect;closeModalBtn.onclick=closeModal;modalBackdrop.onclick=e=>{if(e.target===modalBackdrop)closeModal()};applyLastRefBtn.onclick=applyLastRefs;copyCurrentSearchBtn.onclick=()=>{formEs.value=norm(qEl.value);formEs.focus()};clearFormBtn.onclick=()=>resetForm(false);saveBtn.onclick=()=>saveForm(true);saveAndKeepBtn.onclick=()=>saveForm(false);exportBtn.onclick=exportCustom;exportHtmlBtn.onclick=()=>{const blob=new Blob([document.documentElement.outerHTML],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='spanish_fast_sync_snapshot.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};loadBtn.onclick=()=>{fileInput.value='';fileInput.click()};fileInput.onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)mergeXlsx(f).catch(err=>alert(err.message||err))};
window.addEventListener('keydown',e=>{const mod=e.ctrlKey||e.metaKey||e.altKey;if(mod&&!e.shiftKey&&(e.key==='1'||e.code==='Digit1')){e.preventDefault();openAddModal()}else if(mod&&!e.shiftKey&&(e.key==='2'||e.code==='Digit2')&&modalBackdrop.style.display==='flex'){e.preventDefault();saveForm(true)}else if(mod&&!e.shiftKey&&(e.key==='3'||e.code==='Digit3')){e.preventDefault();qEl.focus();qEl.select()}} ,true);
qEl.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();const s=norm(qEl.value);openAddModal();if(s)formEs.value=s;formEs.focus();formEs.select()}},true);modalBackdrop.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&modalBackdrop.style.display==='flex'){e.preventDefault();saveForm(true)}},true);window.addEventListener('online',()=>{if(cloudEnabled&&cloudLoaded)flushPending()});
if(typeof XLSX==='undefined')warnNoXlsx.style.display='block';setModalMode(false);updateLastRefDisplay();refreshAll();updateCloudStatus();qEl.focus();initializeCloud().finally(()=>{updateLastRefDisplay();refreshAll()});
</script>
</body></html>
